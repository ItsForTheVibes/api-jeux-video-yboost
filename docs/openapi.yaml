openapi: 3.0.3

info:
  title: API Jeux Vidéo
  version: 1.0.0
  description: API de gestion d'une collection de jeux vidéo.

servers:
  - url: http://localhost:3000

paths:
  /api/games:
    get:
      summary: Récupérer tous les jeux
      description: Renvoie la liste complète des jeux. Renvoie un tableau vide si la collection est vide.
      responses:
        '200':
          description: Liste des jeux récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Ajouter un jeu
      description: Valide les données reçues puis enregistre un nouveau jeu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameInput'
      responses:
        '201':
          description: Jeu créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/games/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifiant du jeu (entier strictement positif).
        schema:
          type: integer
          minimum: 1
    get:
      summary: Récupérer un jeu
      description: Renvoie le jeu correspondant à l'identifiant.
      responses:
        '200':
          description: Jeu trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Modifier un jeu
      description: Remplace toutes les informations modifiables du jeu. Tous les champs sont obligatoires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameInput'
      responses:
        '200':
          description: Jeu modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Supprimer un jeu
      description: Supprime définitivement le jeu.
      responses:
        '204':
          description: Jeu supprimé.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    Game:
      type: object
      required: [id, title, editor, releaseYear, genre, rating]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Hades
        editor:
          type: string
          example: Supergiant Games
        releaseYear:
          type: integer
          example: 2020
        genre:
          type: string
          example: Roguelike
        rating:
          type: number
          example: 9.2

    CreateGameInput:
      type: object
      required: [title, editor, releaseYear, genre, rating]
      properties:
        title:
          type: string
          minLength: 1
          example: Elden Ring
        editor:
          type: string
          minLength: 1
          example: Bandai Namco
        releaseYear:
          type: integer
          minimum: 1950
          maximum: 2100
          example: 2022
        genre:
          type: string
          minLength: 1
          example: Action-RPG
        rating:
          type: number
          minimum: 0
          maximum: 10
          example: 9.5

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Données invalides
        details:
          type: array
          items:
            type: string
          example:
            - Le titre est obligatoire
            - La note doit être comprise entre 0 et 10

  responses:
    BadRequest:
      description: Requête invalide (identifiant, données ou JSON incorrects).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Jeu introuvable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Jeu introuvable
    InternalError:
      description: Erreur interne du serveur.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Erreur interne du serveur